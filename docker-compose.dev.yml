services:
  backend:
    build:
      target: development
    command: npm run dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=your_very_secret_key_here
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      target: development
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true

  db:
    ports:
      - "127.0.0.1:5432:5432"
